; Godot export presets (committed). build.ps1 exports "Windows Desktop".
; version.txt is the build stamp build.ps1 writes just before exporting.
; build/* holds the export templates and output -- never packed. docs/* and tests/* are dev-only.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="version.txt"
exclude_filter="build/*,test_logs/*,docs/*"
export_path="build/windows/Flap.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
application/product_name="Flap"
